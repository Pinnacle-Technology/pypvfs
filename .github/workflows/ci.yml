name: CI

on:
  push:
    branches: [main, master, integration]
    tags: ["v*"]
  pull_request:
    branches: [main, master, integration]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # scikit-build-core invokes CMake and a C++17 compiler at install time.
      # ubuntu-latest ships g++ + cmake; windows-latest ships MSVC + cmake.
      # No extra system setup is required.

      - name: Install package with test extras
        # Validate a regular install first, then the editable layout below.
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" -v

      - name: Run tests
        run: pytest -q

      - name: Check editable install
        run: |
          python -m pip install -e . "--config-settings=build-dir=build/editable-tests"
          python -c "from pathlib import Path; from pvfs_tools.Core import pvfs_binding as m; assert Path(m._get_lib()._name).parent != Path(m.__file__).parent"
          python -m pytest tests/test_native_loading.py tests/test_compatibility.py -q

      - name: Check native wrapper contract
        run: |
          cmake -S . -B build/native-tests -DPVFS_BUILD_TESTS=ON
          cmake --build build/native-tests --config Release --parallel 2
          ctest --test-dir build/native-tests -C Release --output-on-failure
