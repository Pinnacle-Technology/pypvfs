[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pypvfs"
version = "1.0.7"
description = "Python bindings for Pinnacle Technology PVFS (virtual filesystem for physiological recordings)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Pinnacle Technology Inc." },
]
dependencies = [
    "numpy",
    "pydantic>=2",
    "SQLAlchemy>=2",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
video = ["av"]
test = ["pytest", "av"]
examples = ["pyedflib", "av"]

[project.urls]
Repository = "https://github.com/Pinnacle-Technology-Inc/pypvfs"
Documentation = "https://github.com/Pinnacle-Technology-Inc/pypvfs/blob/main/docs/USAGE.md"

[project.scripts]
# Discoverable on PATH after `pip install pypvfs`. Prints the location of
# the bundled examples and can copy them out for editing.
pypvfs-examples = "pvfs_tools._examples_cli:main"

# --- Build (scikit-build-core drives CMake) ---------------------------------
#
# CMakeLists.txt at the repo root builds libpvfs and libpvfs_wrapper and
# install()s them into pvfs_tools/Core/ inside the wheel. The Python source
# tree under src/pvfs_tools is shipped alongside.
#
# wheel.py-api = "py3" tags the wheel as "any CPython 3 ABI" because the
# native libraries are loaded via ctypes and never link against libpython,
# so one wheel per platform works for every supported Python.

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.15"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/pvfs_tools"]
wheel.py-api = "py3"
wheel.exclude = [
    # Don't ship C/C++ source or hand-build scaffolding inside the wheel
    "**/*.cpp",
    "**/*.h",
    "**/CMakeLists.txt",
    "**/build_*.sh",
    "**/build_*.ps1",
    "**/execution_policy.txt",
    "**/build",
    "**/build_*",
    "**/CMakeFiles",
    "**/x64",
    "**/Release",
    "**/Debug",
    "**/*.dir",
    # Generated by MSVC; not needed at runtime
    "**/*.exp",
    "**/*.lib",
    "**/*.pdb",
    "**/__pycache__",
]
sdist.include = [
    "CMakeLists.txt",
    "src/pvfs_tools/Core/*.cpp",
    "src/pvfs_tools/Core/*.h",
]
sdist.exclude = [
    "src/pvfs_tools/Core/*.so",
    "src/pvfs_tools/Core/*.dll",
    "src/pvfs_tools/Core/*.exp",
    "src/pvfs_tools/Core/*.lib",
    "src/pvfs_tools/Core/build*",
    "src/pvfs_tools/Core/CMakeFiles",
    "src/pvfs_tools/Core/x64",
    "src/pvfs_tools/Core/Release",
    "src/pvfs_tools/Core/Debug",
    "src/pvfs_tools/Core/*.dir",
]

# --- cibuildwheel -----------------------------------------------------------
#
# Build one wheel per platform (Linux x86_64 + Windows AMD64). The wheel tag
# is py3-none-<plat>, so a single wheel covers every supported Python on
# that platform; we therefore only need one CPython per platform to perform
# the build. cp312 is just the build-time Python.

[tool.cibuildwheel]
build = "cp312-*"
skip = [
    "pp*",
    "*musllinux*",
    "*-manylinux_i686",
    "*-win32",
]
build-verbosity = 1
# Force-import the package + load the native library after install to catch
# any platform/ABI breakage at build time (this is what was silently broken
# in 1.0.1 on Linux).
test-command = "python -c \"import pvfs_tools.Core.pvfs_binding as m; print('loaded:', m._get_lib())\""

[tool.cibuildwheel.linux]
# manylinux_2_28 = AlmaLinux 8 base, glibc 2.28. Wheels built here work on
# RHEL/CentOS/Rocky/Alma 8+, Ubuntu 20.04+, Debian 11+, Amazon Linux 2023, etc.
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
